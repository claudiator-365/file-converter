<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Folio — PDF tools</title>

  <!-- Third-party libraries (CDN). They must load before our own scripts. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>
  <header>
    <button class="logo" id="logo">Folio</button>
    <span>Runs in your browser. Files never leave this tab.</span>
  </header>
  <main id="app"></main>

  <!-- Our code. ORDER MATTERS: these are plain scripts that share one global scope. -->
  <!-- 1. settings and shared globals -->
  <script src="js/config.js"></script>
  <script src="js/setup.js"></script>
  <!-- 2. helpers -->
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/files.js"></script>
  <script src="js/utils/pdf.js"></script>
  <!-- 3. table-extraction engine (namespace first) -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/numbers.js"></script>
  <script src="js/core/text.js"></script>
  <script src="js/core/lines.js"></script>
  <script src="js/core/ruled-tables.js"></script>
  <script src="js/core/aligned-tables.js"></script>
  <script src="js/core/text-blocks.js"></script>
  <script src="js/core/analyze.js"></script>
  <script src="js/core/workbook.js"></script>
  <!-- 4. one file per tool -->
  <script src="js/tools/edit-sign.js"></script>
  <script src="js/tools/pdf-to-excel.js"></script>
  <script src="js/tools/merge.js"></script>
  <script src="js/tools/split.js"></script>
  <script src="js/tools/organize.js"></script>
  <script src="js/tools/compress.js"></script>
  <script src="js/tools/images-to-pdf.js"></script>
  <script src="js/tools/pdf-to-images.js"></script>
  <script src="js/tools/watermark.js"></script>
  <script src="js/tools/page-numbers.js"></script>
  <!-- 5. tool list + start-up (must be last) -->
  <script src="js/app.js"></script>
</body>
</html>
